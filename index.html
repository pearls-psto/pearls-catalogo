<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pearls ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose: #c9928a;
    --rose-light: #e8c4be;
    --rose-pale: #f5e6e3;
    --cream: #fdf8f5;
    --text: #4a3530;
    --text-muted: #9c7b75;
    --white: #ffffff;
    --shadow: rgba(180,120,110,0.12);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--white);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 16px var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.7rem;
    font-weight: 300;
    color: var(--rose);
    letter-spacing: 0.05em;
  }

  .logo span { font-style: italic; }

  .cart-btn {
    background: none;
    border: none;
    cursor: pointer;
    position: relative;
    padding: 6px;
    color: var(--rose);
    font-size: 1.5rem;
    transition: transform 0.2s;
  }
  .cart-btn:hover { transform: scale(1.1); }

  .cart-count {
    position: absolute;
    top: 0; right: 0;
    background: var(--rose);
    color: white;
    font-size: 0.65rem;
    font-weight: 500;
    width: 17px; height: 17px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: scale(0);
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .cart-count.visible { opacity: 1; transform: scale(1); }

  /* ── HERO ── */
  .hero {
    padding: 48px 24px 32px;
    text-align: center;
  }

  .hero h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 8px;
  }

  .hero h2 em { color: var(--rose); font-style: italic; }

  .hero p {
    color: var(--text-muted);
    font-size: 0.9rem;
    letter-spacing: 0.04em;
  }

  /* ── SECCIÓN ── */
  .section-label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px 16px;
    color: var(--rose);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rose-light);
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 0 16px 100px;
  }

  /* ── TARJETA ── */
  .card {
    background: var(--white);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 20px var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px var(--shadow);
  }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--rose-pale);
  }

  /* Placeholder si no hay imagen */
  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(135deg, var(--rose-pale) 0%, var(--rose-light) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
  }

  .card-body {
    padding: 12px 14px 14px;
  }

  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
    line-height: 1.2;
  }

  .card-sku {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }

  .card-price {
    font-size: 1rem;
    font-weight: 500;
    color: var(--rose);
    margin-bottom: 10px;
  }

  .card-add {
    width: 100%;
    background: var(--rose);
    color: white;
    border: none;
    padding: 9px 0;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.2s, transform 0.15s;
  }
  .card-add:hover { background: #b87d75; }
  .card-add:active { transform: scale(0.97); }

  /* ── MODAL OVERLAY ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(74,53,48,0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(3px);
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  /* ── CARRITO MODAL ── */
  .cart-modal {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--white);
    border-radius: 24px 24px 0 0;
    z-index: 300;
    padding: 28px 24px 40px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(.32,.72,0,1);
    max-height: 85vh;
    overflow-y: auto;
  }
  .cart-modal.open { transform: translateY(0); }

  .cart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .cart-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .close-btn {
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px;
    line-height: 1;
    transition: color 0.2s;
  }
  .close-btn:hover { color: var(--text); }

  /* ── ITEM CARRITO ── */
  .cart-item {
    border-top: 1px solid #f0e8e5;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .item-remove {
    position: absolute;
    top: 16px; right: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.9rem;
    line-height: 1;
    transition: color 0.2s;
  }
  .item-remove:hover { color: var(--rose); }

  .item-name {
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text);
    padding-right: 24px;
  }

  .item-sku {
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .item-detail {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .item-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .qty-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 1rem;
    line-height: 1;
    padding: 2px 6px;
    transition: color 0.2s;
  }
  .qty-btn:hover { color: var(--rose); }

  .qty-num {
    font-weight: 500;
    font-size: 0.95rem;
    min-width: 16px;
    text-align: center;
  }

  .item-price {
    font-weight: 500;
    color: var(--rose);
    font-size: 0.95rem;
  }

  /* ── TOTAL ── */
  .cart-total {
    border-top: 1px solid #f0e8e5;
    padding-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-weight: 500;
    font-size: 1rem;
    color: var(--text);
  }

  .cart-total-price { color: var(--rose); font-size: 1.1rem; }

  /* ── BOTONES CHECKOUT ── */
  .checkout-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-whatsapp {
    background: var(--rose);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none;
  }
  .btn-whatsapp:hover { background: #b87d75; transform: scale(1.01); }

  .btn-instagram {
    background: transparent;
    color: var(--rose);
    border: 1.5px solid var(--rose-light);
    padding: 15px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn-instagram:hover { background: var(--rose-pale); }

  /* ── CARRITO VACÍO ── */
  .cart-empty {
    text-align: center;
    padding: 40px 0;
    color: var(--text-muted);
  }
  .cart-empty .emoji { font-size: 2.5rem; margin-bottom: 12px; }
  .cart-empty p { font-size: 0.9rem; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: white;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    white-space: nowrap;
    z-index: 500;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── OPCIONES MODAL (para variantes) ── */
  .options-modal {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--white);
    border-radius: 24px 24px 0 0;
    z-index: 300;
    padding: 28px 24px 40px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(.32,.72,0,1);
  }
  .options-modal.open { transform: translateY(0); }

  .options-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .options-sku {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .options-group { margin-bottom: 18px; }

  .options-group label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 8px;
  }

  .options-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    border: 1.5px solid var(--rose-light);
    color: var(--text-muted);
    background: transparent;
    padding: 7px 14px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pill.selected, .pill:hover {
    background: var(--rose);
    border-color: var(--rose);
    color: white;
  }

  .options-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #f0e8e5;
  }

  .options-price {
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--rose);
  }

  .btn-add-confirm {
    background: var(--rose);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-add-confirm:hover { background: #b87d75; }
</style>
</head>

<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">✨ <span>Pearls</span></div>
  <button class="cart-btn" onclick="openCart()" aria-label="Ver carrito">
    🛒
    <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<!-- ── HERO ── -->
<div class="hero">
  <h2>Pulseras <em>personalizadas</em></h2>
  <p>Hechas con amor · Envío a todo el país</p>
</div>

<!-- ── CATÁLOGO ── -->
<div class="section-label">Colección</div>

<div class="grid" id="productGrid"></div>

<!-- ── OVERLAY ── -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- ── MODAL OPCIONES ── -->
<div class="options-modal" id="optionsModal">
  <div class="cart-header">
    <div>
      <div class="options-title" id="optTitle">Producto</div>
      <div class="options-sku" id="optSku">SKU</div>
    </div>
    <button class="close-btn" onclick="closeAll()">✕</button>
  </div>

  <div class="options-group" id="coloresGroup" style="display:none">
    <label>Color</label>
    <div class="options-pills" id="coloresPills"></div>
  </div>

  <div class="options-group" id="tallaGroup" style="display:none">
    <label>Talla / Tamaño</label>
    <div class="options-pills" id="tallaPills"></div>
  </div>

  <div class="options-footer">
    <div class="options-price" id="optPrice">$0</div>
    <button class="btn-add-confirm" onclick="confirmAdd()">Agregar al carrito</button>
  </div>
</div>

<!-- ── CARRITO MODAL ── -->
<div class="cart-modal" id="cartModal">
  <div class="cart-header">
    <div class="cart-title">🛒 Mi Carrito</div>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>

  <div id="cartItems"></div>

  <div id="cartFooter" style="display:none">
    <div class="cart-total">
      <span>Total</span>
      <span class="cart-total-price" id="totalPrice">$0</span>
    </div>
    <div class="checkout-btns">
      <button class="btn-whatsapp" onclick="sendWhatsApp()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Finalizar pedido por WhatsApp
      </button>
      <button class="btn-instagram" onclick="copyInstagram()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Copiar y enviar por Instagram
      </button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
/* ════════ DATOS ════════
   Personaliza estos productos con tus propios datos.
   Agrega una URL real en "img" o usa emoji en "emoji".
   ═════════════════════ */
const PRODUCTOS = [
  {
    id: 1,
    nombre: "Pulsera Clásica Perlas",
    sku: "PP-001",
    precio: 20000,
    emoji: "🤍",
    colores: ["Blanco", "Crema", "Rosa"],
    tallas: ["XS", "S", "M", "L"],
    img: null
  },
  {
    id: 2,
    nombre: "Pulsera Dorada Élite",
    sku: "PP-002",
    precio: 28000,
    emoji: "✨",
    colores: ["Dorado", "Plateado"],
    tallas: ["S", "M", "L"],
    img: null
  },
  {
    id: 3,
    nombre: "Pulsera Corazón",
    sku: "PP-003",
    precio: 22000,
    emoji: "🩷",
    colores: ["Rosa", "Rojo", "Nude"],
    tallas: ["XS", "S", "M"],
    img: null
  },
  {
    id: 4,
    nombre: "Pulsera Floral Primavera",
    sku: "PP-004",
    precio: 25000,
    emoji: "🌸",
    colores: ["Lila", "Rosado", "Blanco"],
    tallas: ["S", "M", "L"],
    img: null
  },
  {
    id: 5,
    nombre: "Pulsera Minimalista",
    sku: "PP-005",
    precio: 18000,
    emoji: "🔮",
    colores: ["Transparente", "Azul", "Verde"],
    tallas: ["XS", "S", "M", "L"],
    img: null
  },
  {
    id: 6,
    nombre: "Pulsera Bohemia",
    sku: "PP-006",
    precio: 30000,
    emoji: "🌿",
    colores: ["Terracota", "Verde", "Beige"],
    tallas: ["S", "M", "L"],
    img: null
  }
];

// ─── TU NÚMERO DE WHATSAPP (sin + ni espacios) ───
const WHATSAPP_NUM = "573001234567"; // ← Cambia esto

/* ════════ ESTADO ════════ */
let carrito = [];
let productoActual = null;
let selColor = null;
let selTalla = null;

/* ════════ RENDER PRODUCTOS ════════ */
function renderProductos() {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = PRODUCTOS.map(p => `
    <div class="card" onclick="openOptions(${p.id})">
      ${p.img
        ? `<img class="card-img" src="${p.img}" alt="${p.nombre}">`
        : `<div class="card-img-placeholder">${p.emoji}</div>`}
      <div class="card-body">
        <div class="card-name">${p.nombre}</div>
        <div class="card-sku">${p.sku}</div>
        <div class="card-price">${fmt(p.precio)}</div>
        <button class="card-add" onclick="openOptions(${p.id}); event.stopPropagation()">
          + Agregar
        </button>
      </div>
    </div>
  `).join("");
}

/* ════════ MODAL OPCIONES ════════ */
function openOptions(id) {
  productoActual = PRODUCTOS.find(p => p.id === id);
  selColor = null;
  selTalla = null;

  document.getElementById("optTitle").textContent = productoActual.nombre;
  document.getElementById("optSku").textContent = productoActual.sku;
  document.getElementById("optPrice").textContent = fmt(productoActual.precio);

  // Colores
  const cg = document.getElementById("coloresGroup");
  const cp = document.getElementById("coloresPills");
  if (productoActual.colores && productoActual.colores.length) {
    cg.style.display = "block";
    cp.innerHTML = productoActual.colores.map(c =>
      `<button class="pill" onclick="selectPill(this,'color','${c}')">${c}</button>`
    ).join("");
  } else { cg.style.display = "none"; }

  // Tallas
  const tg = document.getElementById("tallaGroup");
  const tp = document.getElementById("tallaPills");
  if (productoActual.tallas && productoActual.tallas.length) {
    tg.style.display = "block";
    tp.innerHTML = productoActual.tallas.map(t =>
      `<button class="pill" onclick="selectPill(this,'talla','${t}')">${t}</button>`
    ).join("");
  } else { tg.style.display = "none"; }

  document.getElementById("overlay").classList.add("open");
  document.getElementById("optionsModal").classList.add("open");
}

function selectPill(btn, tipo, valor) {
  const parent = btn.closest(".options-pills");
  parent.querySelectorAll(".pill").forEach(p => p.classList.remove("selected"));
  btn.classList.add("selected");
  if (tipo === "color") selColor = valor;
  if (tipo === "talla") selTalla = valor;
}

function confirmAdd() {
  const p = productoActual;
  const needsColor = p.colores && p.colores.length;
  const needsTalla = p.tallas  && p.tallas.length;
  if (needsColor && !selColor) { showToast("Elige un color 🎨"); return; }
  if (needsTalla && !selTalla) { showToast("Elige una talla 📏"); return; }

  const key = `${p.id}-${selColor}-${selTalla}`;
  const existe = carrito.find(i => i.key === key);
  if (existe) {
    existe.qty++;
  } else {
    carrito.push({ key, id: p.id, nombre: p.nombre, sku: p.sku,
      color: selColor, talla: selTalla, precio: p.precio, qty: 1 });
  }

  closeAll();
  updateCartCount();
  showToast("¡Agregado al carrito! 🛒");
}

/* ════════ CARRITO ════════ */
function openCart() {
  renderCart();
  document.getElementById("overlay").classList.add("open");
  document.getElementById("cartModal").classList.add("open");
}

function closeCart() {
  document.getElementById("cartModal").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}

function closeAll() {
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("cartModal").classList.remove("open");
  document.getElementById("optionsModal").classList.remove("open");
}

function renderCart() {
  const el   = document.getElementById("cartItems");
  const foot = document.getElementById("cartFooter");

  if (carrito.length === 0) {
    el.innerHTML = `
      <div class="cart-empty">
        <div class="emoji">🛒</div>
        <p>Tu carrito está vacío</p>
      </div>`;
    foot.style.display = "none";
    return;
  }

  el.innerHTML = carrito.map((item, i) => `
    <div class="cart-item">
      <button class="item-remove" onclick="removeItem(${i})">✕</button>
      <div class="item-name">${item.nombre}</div>
      <div class="item-sku">${item.sku}</div>
      ${item.color ? `<div class="item-detail">Color: ${item.color}</div>` : ""}
      ${item.talla ? `<div class="item-detail">Talla: ${item.talla}</div>`  : ""}
      <div class="item-footer">
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i}, +1)">+</button>
        </div>
        <div class="item-price">${fmt(item.precio * item.qty)}</div>
      </div>
    </div>
  `).join("");

  document.getElementById("totalPrice").textContent = fmt(getTotal());
  foot.style.display = "block";
}

function changeQty(i, delta) {
  carrito[i].qty += delta;
  if (carrito[i].qty <= 0) carrito.splice(i, 1);
  updateCartCount();
  renderCart();
}

function removeItem(i) {
  carrito.splice(i, 1);
  updateCartCount();
  renderCart();
}

function getTotal() {
  return carrito.reduce((s, i) => s + i.precio * i.qty, 0);
}

function updateCartCount() {
  const total = carrito.reduce((s, i) => s + i.qty, 0);
  const el = document.getElementById("cartCount");
  el.textContent = total;
  el.classList.toggle("visible", total > 0);
}

/* ════════ CHECKOUT ════════ */
function buildOrderText() {
  let txt = "🛒 *Mi pedido - Pearls*\n\n";
  carrito.forEach(item => {
    txt += `• ${item.nombre} (${item.sku})\n`;
    if (item.color) txt += `  Color: ${item.color}\n`;
    if (item.talla) txt += `  Talla: ${item.talla}\n`;
    txt += `  Cantidad: ${item.qty}\n`;
    txt += `  Subtotal: ${fmt(item.precio * item.qty)}\n\n`;
  });
  txt += `*Total: ${fmt(getTotal())}*`;
  return txt;
}

function sendWhatsApp() {
  if (carrito.length === 0) return;
  const msg = encodeURIComponent(buildOrderText());
  window.open(`https://wa.me/${WHATSAPP_NUM}?text=${msg}`, "_blank");
}

function copyInstagram() {
  if (carrito.length === 0) return;
  navigator.clipboard.writeText(buildOrderText()).then(() => {
    showToast("¡Copiado! Pégalo en Instagram 📋");
  });
}

/* ════════ UTILS ════════ */
function fmt(n) {
  return "$" + n.toLocaleString("es-CO");
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ════════ INIT ════════ */
renderProductos();
</script>
</body>
</html>
