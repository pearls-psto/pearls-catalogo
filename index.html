<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pearls</title>

<style>
body{
font-family: Arial, sans-serif;
background:#fff5f8;
margin:0;
padding:0;
}

header{
background:#f8d7e3;
padding:30px;
text-align:center;
}

h1{
margin:0;
color:#8b5d6b;
}

p{
color:#555;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

.price{
font-size:20px;
font-weight:bold;
color:#d46a92;
}

button{
background:#d46a92;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.footer{
text-align:center;
padding:30px;
}

a{
text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>✨ Pearls ✨</h1>
<p>Pulseras personalizadas hechas con amor 💖</p>
</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/300x300.png?text=Pulsera+1">
<h3>Pulsera Personalizada</h3>
<p class="price">$20.000</p>
<a href="https://wa.me/573158145026">
<button>Pedir por WhatsApp</button>
</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x300.png?text=Pulsera+2">
<h3>Pulsera con Nombre</h3>
<p class="price">$25.000</p>
<a href="https://wa.me/573158145026">
<button>Pedir por WhatsApp</button>
</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x300.png?text=Pulsera+3">
<h3>Pulsera Deluxe</h3>
<p class="price">$40.000</p>
<a href="https://wa.me/573158145026">
<button>Pedir por WhatsApp</button>
</a>
</div>

</div>

<div class="footer">
<p>Instagram:</p>
<a href="https://instagram.com/pearls_psto">
<button>📸 @pearls_psto</button>
</a>
</div>

</body>
</html>
